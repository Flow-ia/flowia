<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>FlowIA</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="application-name" content="FlowIA" />
  <meta name="apple-mobile-web-app-title" content="FlowIA" />
  <meta name="description" content="FlowIA — Gestion et réservation pour votre commerce" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: {
          xs: '375px',
          sm: '640px',
          md: '768px',
          lg: '1024px',
          xl: '1280px',
          '2xl': '1536px',
        },
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['DM Mono', 'SF Mono', 'monospace'],
          },
          colors: {
            brand: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            surface: {
              light: '#ffffff',
              'light-2': '#f8f9fc',
              dark: '#111318',
              'dark-2': '#1c2128',
            },
          },
          borderRadius: {
            '4xl': '2rem',
            '5xl': '2.5rem',
          },
          spacing: {
            safe: 'env(safe-area-inset-bottom, 0px)',
          },
          maxWidth: {
            'app': '1400px',
          },
          boxShadow: {
            'card': '0 2px 16px rgba(0,0,0,0.06)',
            'card-dark': '0 2px 16px rgba(0,0,0,0.3)',
            'float': '0 8px 32px rgba(99,102,241,0.25)',
            'modal': '0 24px 64px rgba(0,0,0,0.18)',
          },
          backdropBlur: {
            xs: '2px',
          },
        },
      },
    }
  </script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    html, body, #root {
      height: 100%;
    }
    body {
      overscroll-behavior: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8f9fc;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #111827;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 0; height: 0; }
    scrollbar-width: none;
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .scroll-x { overflow-x: auto; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }

    /* ── Fonts ── */
    .mono { font-family: 'DM Mono', monospace; }

    /* ── Safe areas ── */
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    .px-safe { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

    /* ── Animations ── */
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideRight { from { opacity:0; transform:translateX(-16px); } to { opacity:1; transform:translateX(0); } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.94); } to { opacity:1; transform:scale(1); } }
    @keyframes shake   { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .animate-spin      { animation: spin 0.8s linear infinite; }
    .animate-fadeIn    { animation: fadeIn 0.22s ease forwards; }
    .animate-fadeInUp  { animation: fadeInUp 0.3s ease forwards; }
    .animate-slideUp   { animation: slideUp 0.28s cubic-bezier(0.16,1,0.3,1) forwards; }
    .animate-scaleIn   { animation: scaleIn 0.20s ease forwards; }
    .animate-slideRight{ animation: slideRight 0.25s ease forwards; }
    .shake             { animation: shake 0.35s ease; }
    .animate-pulse-slow{ animation: pulse 2s ease-in-out infinite; }

    /* Legacy compat */
    .anim-fadeIn  { animation: fadeIn 0.22s ease forwards; }
    .anim-slideUp { animation: slideUp 0.26s ease forwards; }
    .anim-scaleIn { animation: scaleIn 0.20s ease forwards; }

    /* ── Input resets ── */
    input, textarea, select {
      outline: none;
      font-family: inherit;
    }
    input[type=date]::-webkit-calendar-picker-indicator,
    input[type=time]::-webkit-calendar-picker-indicator {
      opacity: 0.5;
      cursor: pointer;
    }

    /* ── Buttons ── */
    button {
      transition: all 0.15s ease;
      font-family: inherit;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* ── App Layout responsive ── */
    #root {
      display: flex;
      flex-direction: column;
    }

    /* ── Glassmorphism utility ── */
    .glass {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-dark {
      background: rgba(17,19,24,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ── Gradient text ── */
    .grad-text {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Responsive grid utilities ── */
    .grid-responsive-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
    }
    @media (min-width: 768px) {
      .grid-responsive-2 { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 1024px) {
      .grid-responsive-2 { grid-template-columns: repeat(4, 1fr); }
    }

    /* ── Desktop layout ── */
    @media (min-width: 1024px) {
      .app-desktop-container {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      .app-sidebar {
        width: 260px;
        flex-shrink: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid rgba(0,0,0,0.07);
      }
      .app-main {
        flex: 1;
        overflow-y: auto;
        height: 100vh;
      }
      .tabbar-mobile-only {
        display: none !important;
      }
    }

    /* ── Card hover ── */
    .card-hover {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    /* ── Status badge ── */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
